[package]
name = "tungsten-mc-compile-jni"
version = "0.211.1"
edition = "2024"
authors = ["Niek Aukes"]
description = "JNI bindings of tungsten-mc-compile for the Tungsten mod (class tungsten.compiler.NativeCompiler)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NiekAukes/tungsten-frontends"

[lib]
name = "tungsten_mc_compile_jni"
# rlib only so the unit tests can link; the mod loads the cdylib
crate-type = ["cdylib", "rlib"]

[dependencies]
tungsten-mc-compile = { path = "../tungsten-mc-compile" }
jni = "0.21.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
